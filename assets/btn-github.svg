<svg xmlns="http://www.w3.org/2000/svg" width="200" height="56" viewBox="0 0 200 56" shape-rendering="crispEdges">
  <defs>
    <style>
      .font-head { font-family: 'Press Start 2P', 'Courier New', monospace; }
      .font-body { font-family: 'Courier New', monospace; }

      @keyframes arrowNudge {
        0%, 100% { transform: translate(0px, 0px); opacity: 1; }
        50% { transform: translate(3px, 0px); opacity: 0.75; }
      }
      @keyframes starBlink {
        0%, 100% { opacity: 0.95; }
        50% { opacity: 0.2; }
      }
      .arrow-move { animation: arrowNudge 1.2s steps(2, end) infinite; }
      .star-tw { animation: starBlink 2.6s steps(2, end) infinite; }
    </style>
  </defs>

  <!-- Opaque dark background -->
  <rect x="0" y="0" width="200" height="56" fill="#07070a"/>

  <!-- Hard offset drop shadow in red -->
  <rect x="10" y="8" width="184" height="44" fill="#9d1c26"/>
  <rect x="7" y="11" width="190" height="38" fill="#9d1c26"/>

  <!-- Outer near-black pixel outline -->
  <rect x="6" y="2" width="184" height="48" fill="#07070a"/>
  <rect x="2" y="6" width="192" height="40" fill="#07070a"/>

  <!-- Chunky 3px pixel border (yellow + white highlight + dark gold bevel) -->
  <rect x="6" y="4" width="184" height="44" fill="#ffd23f"/>
  <rect x="4" y="6" width="188" height="40" fill="#ffd23f"/>
  <!-- Top & left bevel highlight -->
  <rect x="6" y="4" width="184" height="3" fill="#f5f5f5"/>
  <rect x="4" y="6" width="3" height="40" fill="#f5f5f5"/>
  <!-- Bottom & right bevel shadow -->
  <rect x="6" y="45" width="184" height="3" fill="#c99a00"/>
  <rect x="189" y="6" width="3" height="40" fill="#c99a00"/>

  <!-- Panel interior -->
  <rect x="7" y="7" width="182" height="38" fill="#111114"/>
  <!-- Subtle horizontal pixel band at bottom -->
  <rect x="7" y="33" width="182" height="12" fill="#1a1a1f"/>

  <!-- Tiny decorative background stars -->
  <rect x="148" y="12" width="2" height="2" fill="#f5f5f5" class="star-tw"/>
  <rect x="158" y="36" width="2" height="2" fill="#ffd23f" class="star-tw"/>
  <rect x="136" y="38" width="2" height="2" fill="#e63946" opacity="0.75"/>

  <!-- Corner accent pixels in red -->
  <rect x="6" y="4" width="3" height="3" fill="#e63946"/>
  <rect x="187" y="4" width="3" height="3" fill="#e63946"/>
  <rect x="6" y="45" width="3" height="3" fill="#e63946"/>
  <rect x="187" y="45" width="3" height="3" fill="#e63946"/>

  <!-- Left icon slot -->
  <rect x="14" y="11" width="30" height="30" fill="#07070a"/>
  <rect x="14" y="11" width="30" height="2" fill="#c99a00"/>
  <rect x="14" y="39" width="30" height="2" fill="#9d1c26"/>
  <rect x="14" y="11" width="2" height="30" fill="#c99a00"/>
  <rect x="42" y="11" width="2" height="30" fill="#9d1c26"/>

  <!-- Pixel "</>" code icon inside slot (2px grid) -->
  <g>
    <!-- '<' in yellow -->
    <rect x="22" y="19" width="2" height="2" fill="#ffd23f"/>
    <rect x="20" y="21" width="2" height="2" fill="#ffd23f"/>
    <rect x="18" y="23" width="2" height="4" fill="#f5f5f5"/>
    <rect x="20" y="27" width="2" height="2" fill="#ffd23f"/>
    <rect x="22" y="29" width="2" height="2" fill="#ffd23f"/>

    <!-- '/' in red -->
    <rect x="30" y="19" width="2" height="2" fill="#e63946"/>
    <rect x="29" y="21" width="2" height="2" fill="#e63946"/>
    <rect x="28" y="23" width="2" height="4" fill="#e63946"/>
    <rect x="27" y="27" width="2" height="2" fill="#e63946"/>
    <rect x="26" y="29" width="2" height="2" fill="#9d1c26"/>

    <!-- '>' in yellow -->
    <rect x="34" y="19" width="2" height="2" fill="#ffd23f"/>
    <rect x="36" y="21" width="2" height="2" fill="#ffd23f"/>
    <rect x="38" y="23" width="2" height="4" fill="#f5f5f5"/>
    <rect x="36" y="27" width="2" height="2" fill="#ffd23f"/>
    <rect x="34" y="29" width="2" height="2" fill="#ffd23f"/>
  </g>

  <!-- Text labels -->
  <text x="54" y="24" class="font-head" font-size="9.5" fill="#ffd23f" letter-spacing="0.5">GITHUB</text>
  <text x="54" y="39" class="font-body" font-size="12" font-weight="bold" fill="#f5f5f5">@b00001</text>

  <!-- Right pixel ">" arrow with subtle nudge -->
  <g class="arrow-move">
    <rect x="171" y="18" width="3" height="3" fill="#e63946"/>
    <rect x="174" y="21" width="3" height="3" fill="#e63946"/>
    <rect x="177" y="24" width="3" height="4" fill="#ffd23f"/>
    <rect x="174" y="28" width="3" height="3" fill="#e63946"/>
    <rect x="171" y="31" width="3" height="3" fill="#e63946"/>
  </g>
</svg>
