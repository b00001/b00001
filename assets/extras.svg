<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340" shape-rendering="crispEdges">
  <defs>
    <style>
      .font-head { font-family: 'Press Start 2P', 'Courier New', monospace; }
      .font-body { font-family: 'Courier New', monospace; }

      @keyframes twinkleA {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }
      @keyframes twinkleB {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 1; }
      }
      @keyframes starDrift {
        0%, 100% { transform: translate(0px, 0px); opacity: 0.85; }
        50% { transform: translate(6px, -4px); opacity: 0.3; }
      }
      @keyframes starDriftSlow {
        0%, 100% { transform: translate(0px, 0px); opacity: 0.4; }
        50% { transform: translate(-7px, 3px); opacity: 0.9; }
      }
      @keyframes distantSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes pressStartBlink {
        0%, 58% { opacity: 1; }
        59%, 100% { opacity: 0.15; }
      }
      @keyframes recBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0.2; }
      }
      @keyframes reelPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      @keyframes eq1 {
        0%, 100% { transform: scaleY(0.35); }
        25% { transform: scaleY(0.95); }
        50% { transform: scaleY(0.5); }
        75% { transform: scaleY(0.8); }
      }
      @keyframes eq2 {
        0%, 100% { transform: scaleY(0.85); }
        25% { transform: scaleY(0.4); }
        50% { transform: scaleY(1); }
        75% { transform: scaleY(0.55); }
      }
      @keyframes eq3 {
        0%, 100% { transform: scaleY(0.45); }
        30% { transform: scaleY(0.9); }
        60% { transform: scaleY(0.3); }
        85% { transform: scaleY(0.75); }
      }
      @keyframes eq4 {
        0%, 100% { transform: scaleY(0.7); }
        20% { transform: scaleY(0.3); }
        55% { transform: scaleY(0.88); }
        80% { transform: scaleY(0.45); }
      }

      .tw-a { animation: twinkleA 2.6s steps(2, end) infinite; }
      .tw-b { animation: twinkleB 3.4s steps(2, end) infinite; }
      .drift-a { animation: starDrift 6.5s ease-in-out infinite; }
      .drift-b { animation: starDriftSlow 8.2s ease-in-out -2.4s infinite; }
      .distant-spin {
        transform-box: fill-box;
        transform-origin: center;
        animation: distantSpin 84s linear infinite;
      }
      .press-blink { animation: pressStartBlink 1.4s steps(1, end) infinite; }
      .rec-dot { animation: recBlink 1.1s steps(1, end) infinite; }
      .reel-a { animation: reelPulse 0.9s steps(2, end) infinite; }
      .reel-b { animation: reelPulse 0.9s steps(2, end) 0.45s infinite; }
      .eq-bar-1 { animation: eq1 0.85s steps(4, end) infinite; }
      .eq-bar-2 { animation: eq2 0.72s steps(4, end) infinite; }
      .eq-bar-3 { animation: eq3 0.94s steps(4, end) infinite; }
      .eq-bar-4 { animation: eq4 0.78s steps(4, end) infinite; }
    </style>

    <!-- Reusable tiny pixel star icon -->
    <symbol id="log-star" viewBox="0 0 10 10">
      <rect x="4" y="0" width="2" height="10" fill="currentColor"/>
      <rect x="0" y="4" width="10" height="2" fill="currentColor"/>
      <rect x="2" y="2" width="6" height="6" fill="currentColor"/>
      <rect x="4" y="4" width="2" height="2" fill="#f5f5f5"/>
    </symbol>

    <!-- Distant small pixel spiral galaxy -->
    <g id="mini-spiral">
      <rect x="-24" y="-24" width="48" height="48" fill="none"/>
      <rect x="-4" y="-4" width="8" height="8" fill="#ffd23f"/>
      <rect x="-2" y="-2" width="4" height="4" fill="#f5f5f5"/>
      <!-- Arm 1 -->
      <rect x="4" y="-2" width="6" height="4" fill="#ffd23f" opacity="0.9"/>
      <rect x="8" y="2" width="6" height="4" fill="#e63946" opacity="0.85"/>
      <rect x="4" y="8" width="6" height="4" fill="#c99a00" opacity="0.75"/>
      <rect x="-6" y="10" width="8" height="4" fill="#9d1c26" opacity="0.65"/>
      <rect x="-14" y="6" width="6" height="4" fill="#c99a00" opacity="0.5"/>
      <rect x="-18" y="-2" width="4" height="4" fill="#8a8a8f" opacity="0.45"/>
      <!-- Arm 2 (mirrored) -->
      <rect x="-10" y="-2" width="6" height="4" fill="#ffd23f" opacity="0.9"/>
      <rect x="-14" y="-6" width="6" height="4" fill="#e63946" opacity="0.85"/>
      <rect x="-10" y="-12" width="6" height="4" fill="#c99a00" opacity="0.75"/>
      <rect x="-2" y="-14" width="8" height="4" fill="#9d1c26" opacity="0.65"/>
      <rect x="8" y="-10" width="6" height="4" fill="#c99a00" opacity="0.5"/>
      <rect x="14" y="-2" width="4" height="4" fill="#8a8a8f" opacity="0.45"/>
    </g>
  </defs>

  <!-- Opaque dark outer canvas background -->
  <rect x="0" y="0" width="840" height="340" fill="#07070a"/>

  <!-- Tiny drifting background stars on outer canvas -->
  <g>
    <rect x="304" y="16" width="2" height="2" fill="#f5f5f5" class="drift-a"/>
    <rect x="366" y="12" width="3" height="3" fill="#ffd23f" class="drift-b"/>
    <rect x="652" y="14" width="2" height="2" fill="#e63946" class="drift-a"/>
    <rect x="742" y="18" width="2" height="2" fill="#f5f5f5" class="drift-b"/>
    <rect x="58" y="306" width="2" height="2" fill="#f5f5f5" class="drift-a"/>
    <rect x="128" y="318" width="3" height="3" fill="#ffd23f" class="drift-b"/>
    <rect x="708" y="312" width="2" height="2" fill="#f5f5f5" class="drift-a"/>
    <rect x="774" y="304" width="3" height="3" fill="#e63946" class="drift-b"/>
  </g>

  <g transform="translate(-205 0)">
  <!-- ==================== RIGHT SUB-PANEL: ON REPEAT ♪ ==================== -->
  <!-- Hard offset drop shadow in red -->
  <rect x="434" y="40" width="392" height="244" fill="#9d1c26"/>
  <rect x="430" y="44" width="400" height="236" fill="#9d1c26"/>
  <rect x="434" y="16" width="184" height="28" fill="#9d1c26"/>

  <!-- Outer near-black pixel outline -->
  <rect x="428" y="30" width="392" height="252" fill="#07070a"/>
  <rect x="420" y="38" width="408" height="236" fill="#07070a"/>
  <rect x="428" y="6" width="184" height="32" fill="#07070a"/>
  <rect x="424" y="10" width="192" height="28" fill="#07070a"/>

  <!-- Chunky 4px border (white + yellow accents + dark gray bevel) -->
  <rect x="428" y="34" width="392" height="244" fill="#f5f5f5"/>
  <rect x="424" y="38" width="400" height="236" fill="#f5f5f5"/>
  <rect x="428" y="274" width="392" height="4" fill="#8a8a8f"/>
  <rect x="820" y="38" width="4" height="236" fill="#8a8a8f"/>

  <!-- Right panel interior -->
  <rect x="430" y="38" width="388" height="236" fill="#111114"/>

  <!-- Subtle drifting background stars inside right panel -->
  <rect x="786" y="54" width="2" height="2" fill="#ffd23f" class="drift-b"/>
  <rect x="798" y="114" width="2" height="2" fill="#f5f5f5" opacity="0.6" class="drift-a"/>

  <!-- Right Tab: ON REPEAT ♪ -->
  <rect x="428" y="10" width="184" height="28" fill="#f5f5f5"/>
  <rect x="424" y="14" width="192" height="24" fill="#f5f5f5"/>
  <rect x="612" y="14" width="4" height="24" fill="#8a8a8f"/>
  <rect x="430" y="14" width="180" height="28" fill="#111114"/>

  <!-- Tiny pixel music note in tab -->
  <g transform="translate(440, 18)">
    <rect x="4" y="0" width="6" height="2" fill="#ffd23f"/>
    <rect x="4" y="2" width="2" height="6" fill="#ffd23f"/>
    <rect x="0" y="6" width="6" height="4" fill="#e63946"/>
  </g>
  <text x="456" y="29" class="font-head" font-size="9.5" fill="#e63946" letter-spacing="0.4">ON REPEAT ♪</text>

  <!-- Corner jewels (right panel, yellow/red) -->
  <rect x="428" y="10" width="4" height="4" fill="#ffd23f"/>
  <rect x="816" y="34" width="4" height="4" fill="#ffd23f"/>
  <rect x="428" y="274" width="4" height="4" fill="#e63946"/>
  <rect x="816" y="274" width="4" height="4" fill="#e63946"/>

  <!-- SMALL PIXEL CASSETTE DECK (top of right panel) -->
  <g transform="translate(448, 52)">
    <!-- Cassette shadow -->
    <rect x="3" y="3" width="106" height="62" fill="#07070a"/>
    <!-- Cassette shell -->
    <rect x="0" y="0" width="106" height="62" fill="#1a1a1f" stroke="#8a8a8f" stroke-width="2"/>
    <!-- Corner screws -->
    <rect x="4" y="4" width="3" height="3" fill="#f5f5f5"/>
    <rect x="99" y="4" width="3" height="3" fill="#f5f5f5"/>
    <rect x="4" y="55" width="3" height="3" fill="#f5f5f5"/>
    <rect x="99" y="55" width="3" height="3" fill="#f5f5f5"/>

    <!-- Retro Cassette Label -->
    <rect x="8" y="7" width="90" height="34" fill="#111114"/>
    <rect x="8" y="7" width="90" height="7" fill="#ffd23f"/>
    <rect x="8" y="14" width="90" height="4" fill="#e63946"/>
    <!-- Tiny label text lines -->
    <rect x="14" y="9" width="24" height="3" fill="#07070a"/>
    <rect x="80" y="9" width="12" height="3" fill="#07070a"/>

    <!-- Center Tape Window -->
    <rect x="18" y="21" width="70" height="16" fill="#07070a"/>
    <!-- Left Tape Reel -->
    <rect x="24" y="23" width="12" height="12" fill="#2a2a30"/>
    <rect x="26" y="25" width="8" height="8" fill="#07070a"/>
    <rect x="28" y="27" width="4" height="4" fill="#f5f5f5" class="reel-a"/>
    <rect x="29" y="24" width="2" height="10" fill="#ffd23f" class="reel-b"/>
    <!-- Right Tape Reel -->
    <rect x="70" y="23" width="12" height="12" fill="#2a2a30"/>
    <rect x="72" y="25" width="8" height="8" fill="#07070a"/>
    <rect x="74" y="27" width="4" height="4" fill="#f5f5f5" class="reel-b"/>
    <rect x="75" y="24" width="2" height="10" fill="#ffd23f" class="reel-a"/>
    <!-- Tape window middle glass ticks -->
    <rect x="42" y="27" width="22" height="4" fill="#1a1a1f"/>
    <rect x="46" y="28" width="14" height="2" fill="#e63946"/>

    <!-- Bottom Cassette Trap Door -->
    <rect x="22" y="48" width="62" height="14" fill="#111114"/>
    <rect x="26" y="48" width="54" height="2" fill="#8a8a8f"/>
    <rect x="30" y="53" width="6" height="5" fill="#07070a"/>
    <rect x="70" y="53" width="6" height="5" fill="#07070a"/>
    <rect x="48" y="54" width="10" height="4" fill="#07070a"/>
  </g>

  <!-- Now Playing Metadata beside cassette -->
  <g>
    <rect x="572" y="57" width="6" height="6" fill="#e63946" class="rec-dot"/>
    <text x="584" y="64" class="font-head" font-size="8.5" fill="#f5f5f5" letter-spacing="0.5">NOW PLAYING</text>
    <text x="572" y="84" class="font-body" font-size="14" font-weight="bold" fill="#ffd23f">Starlight Drive</text>
    <!-- Mini playback scrubber -->
    <rect x="572" y="94" width="184" height="6" fill="#07070a" stroke="#8a8a8f" stroke-width="1"/>
    <rect x="573" y="95" width="102" height="4" fill="#e63946"/>
    <rect x="673" y="93" width="4" height="8" fill="#ffd23f"/>
    <text x="572" y="113" class="font-body" font-size="10.5" fill="#8a8a8f">SIDE A · 01:42 / 03:18</text>
  </g>

  <!-- TRACK LIST 01 - 04 -->
  <!-- Track 01: HIGHLIGHTED with animated 4-bar pixel equalizer -->
  <g>
    <rect x="446" y="128" width="356" height="30" fill="#1a1a1f"/>
    <rect x="446" y="128" width="356" height="2" fill="#ffd23f"/>
    <rect x="446" y="156" width="356" height="2" fill="#ffd23f"/>
    <rect x="446" y="128" width="2" height="30" fill="#ffd23f"/>
    <rect x="800" y="128" width="2" height="30" fill="#ffd23f"/>
    <!-- Track 01 title -->
    <text x="458" y="147" class="font-body" font-size="13" font-weight="bold" fill="#ffd23f" xml:space="preserve">01  Starlight Drive</text>

    <!-- Animated 4-bar Pixel Equalizer (anchored at bottom y=151) -->
    <g transform="translate(762, 151)">
      <rect x="0" y="-16" width="4" height="16" fill="#e63946" class="eq-bar-1"/>
    </g>
    <g transform="translate(769, 151)">
      <rect x="0" y="-16" width="4" height="16" fill="#ffd23f" class="eq-bar-2"/>
    </g>
    <g transform="translate(776, 151)">
      <rect x="0" y="-16" width="4" height="16" fill="#f5f5f5" class="eq-bar-3"/>
    </g>
    <g transform="translate(783, 151)">
      <rect x="0" y="-16" width="4" height="16" fill="#ffd23f" class="eq-bar-4"/>
    </g>
  </g>

  <!-- Track 02 -->
  <text x="458" y="182" class="font-body" font-size="13" font-weight="bold" xml:space="preserve"><tspan fill="#e63946">02</tspan><tspan fill="#f5f5f5">  Moon Cafe</tspan></text>
  <text x="792" y="182" text-anchor="end" class="font-body" font-size="11.5" fill="#8a8a8f">02:54</text>
  <line x1="448" y1="194" x2="800" y2="194" stroke="#26262c" stroke-width="2" stroke-dasharray="3 4"/>

  <!-- Track 03 -->
  <text x="458" y="216" class="font-body" font-size="13" font-weight="bold" xml:space="preserve"><tspan fill="#e63946">03</tspan><tspan fill="#f5f5f5">  Orbit Lullaby</tspan></text>
  <text x="792" y="216" text-anchor="end" class="font-body" font-size="11.5" fill="#8a8a8f">03:40</text>
  <line x1="448" y1="228" x2="800" y2="228" stroke="#26262c" stroke-width="2" stroke-dasharray="3 4"/>

  <!-- Track 04 -->
  <text x="458" y="250" class="font-body" font-size="13" font-weight="bold" xml:space="preserve"><tspan fill="#e63946">04</tspan><tspan fill="#f5f5f5">  Comet Tail</tspan></text>
  <text x="792" y="250" text-anchor="end" class="font-body" font-size="11.5" fill="#8a8a8f">02:28</text>


  </g>

  <!-- ==================== BOTTOM BLINKING ARCADE PROMPT ==================== -->
  <g>
    <!-- Flanking subtle pixel sparkles -->
    <g color="#f5f5f5">
      <use href="#log-star" x="196" y="307" width="8" height="8" class="tw-a"/>
      <use href="#log-star" x="636" y="307" width="8" height="8" class="tw-b"/>
    </g>
    <rect x="216" y="310" width="4" height="4" fill="#e63946" class="tw-b"/>
    <rect x="620" y="310" width="4" height="4" fill="#e63946" class="tw-a"/>

    <!-- Blinking "PRESS START TO CONTINUE ★" -->
    <g class="press-blink">
      <text x="422" y="318" text-anchor="middle" class="font-head" font-size="11.5" fill="#9d1c26" letter-spacing="1.2">PRESS START TO CONTINUE ★</text>
      <text x="420" y="316" text-anchor="middle" class="font-head" font-size="11.5" fill="#ffd23f" letter-spacing="1.2">PRESS START TO CONTINUE ★</text>
    </g>
  </g>
</svg>
